<h4>Añadir personaje</h4>
<form class="row g-3" (ngSubmit)="saveCharacter()">
  <input
    class="form-control"
    type="text"
    placeholder="Nombre"
    name="name"
    [(ngModel)]="character.name"
  />
  <input
    class="form-control"
    type="number"
    placeholder="Poder"
    name="power"
    [(ngModel)]="character.power"
  />
  <button class="btn btn-success" type="submit">Añadir</button>

  <!-- <pre>{{ character | json }}</pre> -->
</form>
