<div
  *ngIf="countries.length === 0; else table"
  class="flex items-center p-4 mb-4 text-sm text-blue-800 rounded-lg bg-blue-50 dark:bg-gray-800 dark:text-blue-400"
  role="alert"
>
  <svg
    class="flex-shrink-0 inline w-4 h-4 me-3"
    aria-hidden="true"
    xmlns="http://www.w3.org/2000/svg"
    fill="currentColor"
    viewBox="0 0 20 20"
  >
    <path
      d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM9.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3ZM12 15H8a1 1 0 0 1 0-2h1v-3H8a1 1 0 0 1 0-2h2a1 1 0 0 1 1 1v4h1a1 1 0 0 1 0 2Z"
    />
  </svg>
  <span class="sr-only">Info</span>
  <div>No hay resultados por mostrar.</div>
</div>

<ng-template #table>
  <table
    class="w-full text-sm text-left rtl:text-right text-gray-500 dark:text-gray-400"
  >
    <thead
      class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400"
    >
      <tr>
        <th scope="col" class="px-6 py-3">#</th>
        <th scope="col" class="px-6 py-3">Bandera</th>
        <th scope="col" class="px-6 py-3">Nombre</th>
        <th scope="col" class="px-6 py-3">Capital</th>
        <th scope="col" class="px-6 py-3">Población</th>
        <th scope="col" class="px-6 py-3"></th>
      </tr>
    </thead>
    <tbody>
      <tr
        *ngFor="let country of countries; let i = index"
        class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600"
      >
        <th
          scope="row"
          class="px-6 py-4 font-medium text-gray-900 whitespace-nowrap dark:text-white"
        >
          {{ i + 1 }}
        </th>
        <td class="px-6 py-4">
          <img
            class="h-10"
            [src]="country.flags.png"
            [alt]="country.flags.alt"
          />
        </td>
        <td class="px-6 py-4">{{ country.name.common }}</td>
        <td class="px-6 py-4">{{ country.capital }}</td>
        <td class="px-6 py-4">{{ country.population | number}}</td>
        <td class="px-6 py-4">
          <a
            [routerLink]="['/countries/by/', country.cca3]"
            class="font-medium text-blue-600 dark:text-blue-500 hover:underline"
            >Saber más</a
          >
        </td>
      </tr>
    </tbody>
  </table>
</ng-template>
